[package]
name = "dungeon-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
dungeon-generator = { version = "0.1.0", path = ".." }
# only the native desktop targets (Windows, macOS, Linux) are supported
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "clipboard", "wayland", "x11"] }
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37.0", features = ["image"] }
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe"] }
